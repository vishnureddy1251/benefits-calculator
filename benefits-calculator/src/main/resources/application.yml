spring:
  application:
    name: benefits-calculator

  datasource:
    url: jdbc:sqlite:benefits_calculator.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 5124
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.paylocity.benefits_calculator: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins: http://localhost:3000,http://localhost
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600

app:
  payroll:
    total-paychecks-per-year: 26
    employee-benefit-cost-monthly: 1000.00
    dependent-benefit-cost-monthly-under-50: 600.00
    dependent-benefit-cost-monthly-over-50: 800.00
    high-salary-threshold: 80000.00
    high-salary-additional-deduction-percent: 2.0